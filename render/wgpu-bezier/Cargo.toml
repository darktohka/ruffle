[package]
name = "ruffle_render_wgpu_bezier"
authors = ["Ruffle Contributors"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "A GPU-accelerated Ruffle renderer using direct quadratic Bézier curve rendering (Loop-Blinn) instead of CPU-side tessellation."

[lints]
workspace = true

[dependencies]
wgpu = { workspace = true }
tracing = { workspace = true }
ruffle_render = { path = ".." }
bytemuck = { workspace = true, features = ["derive"] }
enum-map = { workspace = true }
swf = { path = "../../swf" }
indexmap = { workspace = true }
lyon_geom = "1.0.6"

# desktop
[target.'cfg(not(target_family = "wasm"))'.dependencies.futures]
workspace = true

# wasm
[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
workspace = true
features = ["HtmlCanvasElement"]

[features]
render_debug_labels = []
webgl = ["wgpu/webgl"]
